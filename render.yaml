# Render Blueprint for AuditPulse
# https://render.com/docs/blueprint-spec

services:
  # ── 1. Backend Web Service (FastAPI) ──
  - type: web
    name: auditpulse-backend
    runtime: python
    rootDir: auditpulse/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: AI_PROVIDER
        value: mock
      - key: APP_ENV
        value: production
      - key: APP_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"

  # ── 2. Frontend Static Site (React + Vite) ──
  - type: web
    name: auditpulse-frontend
    runtime: static
    rootDir: auditpulse/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: auditpulse-backend
          property: host
